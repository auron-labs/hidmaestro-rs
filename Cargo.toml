[workspace]
resolver = "2"
members = ["crates/hidmaestro", "crates/hidmaestro-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
repository = "https://github.com/auron-labs/hidmaestro-rs"
license = "MIT"
keywords = ["controller", "gamepad", "hid", "testing", "windows"]
categories = ["development-tools::testing", "game-development", "hardware-support"]

[workspace.dependencies]
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace]
resolver = "2"
members = ["crates/hidmaestro", "crates/hidmaestro-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hifihedgehog/HIDMaestro"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bitflags = { version = "2", features = ["serde"] }
